<section><div class="wrap" id="pay" style="max-width:520px;text-align:center"><h1 class="t" data-t="payment.title">Pay with Bangla QR</h1><p class="sub" data-c="payNote"></p><img src="assets/images/payment/bangla-qr.png" alt="Bangla QR" style="margin:0 auto 12px;width:100%;max-width:340px"><p>Account: <b data-c="accountName"></b></p><p>bKash: <b data-c="bkash"></b><br>Nagad: <b data-c="nagad"></b></p><p class="sub">Cash on Delivery is also available at checkout.</p><ol style="text-align:left"><li data-t="payment.s1">Scan the QR with your bank app, bKash or Nagad.</li><li data-t="payment.s2">Pay the order amount.</li><li data-t="payment.s3">Send the screenshot on WhatsApp.</li></ol><a class="btn" data-wa="I have paid. Sending the payment screenshot." href="#" data-t="payment.btn">Send Screenshot on WhatsApp</a></div></section><script src="config.js"></script><script src="data/products.js"></script><script src="data/site.js"></script><script src="app.js"></script><script src="popup.js"></script></body></html>
