<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NICE FASHION Control</title><style>
:root{--bg:#0b0b0b;--panel:#141414;--line:#2a2a2a;--text:#f2f2ee;--muted:#9a9a94;--accent:#c8a96e;--ok:#4aa36a;--err:#d9534f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--accent);text-decoration:none}
h1{font-size:25px;margin:0 0 6px;font-weight:600}
.muted{color:var(--muted);margin:0 0 16px}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 130px}
.top{position:sticky;top:0;z-index:20;background:rgba(11,11,11,.97);border-bottom:1px solid var(--line);padding:10px 14px}
.toprow{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.14em}.brand span{color:var(--accent);font-weight:500}
.toolbtns{display:flex;gap:6px;flex-wrap:wrap}
.nav{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;padding:8px 0 2px;-webkit-overflow-scrolling:touch}
.pill,.tb{padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:#d6d6d0;background:transparent;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sep{align-self:center;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:0 4px}
.msg{padding:12px 14px;border-radius:8px;margin:0 0 12px;font-size:14px;white-space:pre-wrap}
.msg.ok{background:rgba(74,163,106,.15);border:1px solid var(--ok)}
.msg.err{background:rgba(217,83,79,.14);border:1px solid var(--err)}
.msg.info{background:rgba(200,169,110,.12);border:1px solid var(--accent)}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--text);cursor:pointer;text-align:left;font:inherit;width:100%}
.card b{display:block;font-size:17px;margin-bottom:2px}.card span{color:var(--muted);font-size:13px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.row-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#191919;border-bottom:1px solid var(--line);flex-wrap:wrap}
.badge{flex:0 0 auto;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:600;padding:0 6px}
.rtitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rbtns{display:flex;gap:6px;margin-left:auto}
.rbtns button{height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#222;color:#eee;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.rbtns button b{font-size:16px;margin-right:3px}
.rbtns .del{color:#ff8a85;border-color:#6b2f2d;background:#2a1514}
@media (max-width:560px){.rbtns{width:100%}.rbtns button{flex:1}}
.rbody{padding:14px;display:grid;grid-template-columns:1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span.l{font-size:12px;color:var(--muted);letter-spacing:.04em}
.fld small{color:var(--muted);font-size:12px}
input[type=text],input[type=password],textarea,select{width:100%;background:#0f0f0f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:inherit;font-size:16px}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.group{border:1px dashed var(--line);border-radius:10px;padding:10px}
.imgbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pv{width:150px;height:112px;object-fit:cover;border:1px solid var(--line);border-radius:8px;background:#0f0f0f}
.pv[hidden]{display:none}
.imgctl{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:#d6d6d0}
.chk input{width:20px;height:20px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:10px;padding:13px 20px;font:inherit;font-weight:600;cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;color:var(--text);border-color:#555}
.btn.small{padding:8px 14px;min-height:38px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,11,11,.97);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.savebar .st{font-size:13px;color:var(--muted)}
.savebar .st.dirty{color:#f0c27a}
.login{max-width:420px;margin:8vh auto 0;padding:0 16px}
.login h1{letter-spacing:.14em}.login h1 span{color:var(--accent);font-weight:500}
.login .btn{width:100%;margin-top:6px}
.login .fld{margin-bottom:12px}
.addrow{margin:2px 0 16px}
.nested{margin-top:4px}
@media (min-width:760px){.cards{grid-template-columns:repeat(3,1fr)}.rbody{grid-template-columns:1fr 1fr}.fld.full{grid-column:1/-1}}

.pill.on,.btn,.badge{color:#111}.btn.ghost{color:var(--text)}.btn.ghost[disabled],.rbtns button[disabled]{opacity:.4}
.thumb{width:40px;height:50px;object-fit:cover;border-radius:6px;background:#0f0f0f;flex:none}
.rtitle .sub{font-weight:400;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.rhead2{padding:10px 14px;font-weight:600;background:#191919;border-bottom:1px solid var(--line)}
.th2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.th2 div{position:relative}.th2 img{width:64px;height:80px;object-fit:cover;border-radius:6px}.th2 a{position:absolute;top:2px;right:2px;background:#000;color:#fff;border-radius:10px;padding:0 7px;cursor:pointer}
details.box summary{cursor:pointer;font-weight:600}details.box p,details.box li{color:#d6d6d0;margin:6px 0}
.stat{display:flex;gap:8px;flex-wrap:wrap}.stat span{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:#d6d6d0}
input[type=number],input[type=color]{width:100%;background:#0f0f0f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:inherit;font-size:16px}input[type=color]{height:46px;padding:4px}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'),clean=s=>String(s).replace(/[<>"]/g,''),sl=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const CK='nf_admin_cfg';
const PAYK=['onlineSelling','currency','cod','deliveryDhaka','deliveryOutside','bkash','bkashUrl','showBkashQr','nagad','payment','accountName','payNote','trxAsk'];
const DEF={bkashUrl:'',showBkashQr:true,trxAsk:true,nagad:'',onlineSelling:false,offerTextOff:'Visit our showroom · Easy exchange',btnOrder:'Order on WhatsApp',btnInquiry:'Check Availability on WhatsApp',mapEmbed:'',secTrust:true,secCategories:true,secNew:true,secBanner:true,secCta:true,accent:'#c8a96e',bgColor:'#09090a'};
const AB={founder:'Founder Name',founder_title:'Founder',shop_addr:'Shop address, City',office_addr:'Office address, City',open_time:'10:00 AM',close_time:'9:00 PM',off_days:'Friday closed',office_hours:'Sat–Thu, 10:00 AM – 6:00 PM'};
const SZ={panjabi:'38,40,42,44',jeans:'30,32,34,36',pants:'30,32,34,36',trousers:'30,32,34,36',accessories:'Free Size'};
const GR={index:'home',category:'shop',gallery:'gallery',about:'about',contact:'contact',payment:'payment'};
const LB={brand:'Brand name',tagline:'Tagline',whatsapp:'WhatsApp number (e.g. 88017XXXXXXXX)',phone:'Phone shown on site',email:'Email',address:'Address',facebook:'Facebook link',instagram:'Instagram link',currency:'Currency symbol',cod:'Cash on Delivery',deliveryDhaka:'Delivery charge inside Dhaka',deliveryOutside:'Delivery charge outside Dhaka',bkash:'bKash number (shown to customers)',bkashUrl:'bKash payment link (URL, optional)',showBkashQr:'Show bKash QR code',nagad:'Nagad number (optional)',payment:'Show Bangla QR code',trxAsk:'Ask for Transaction ID (TrxID) at checkout',accountName:'QR account name',payNote:'Payment note',offer:'Show offer bar',offerText:'Offer bar text (Online Selling ON)',offerTextOff:'Offer bar text (Online Selling OFF)',btnOrder:'Order button text',btnInquiry:'Availability button text',hidePlaceholders:'Show only products ticked "Show on website"',showroom:'Show showroom section',showroomAddress:'Showroom address',showroomHours:'Showroom hours',showroomMap:'Directions link (optional)',mapEmbed:'Google Map: paste the embed code (Maps > Share > Embed a map)',secTrust:'Home: trust strip',secCategories:'Home: category tiles',secNew:'Home: new arrivals',secBanner:'Home: banner',secCta:'Home: WhatsApp call-to-action',accent:'Accent color',bgColor:'Background color',popup:'Show popup',popupTitle:'Popup title',popupText:'Popup text',popupButton:'Popup button text',popupLink:'Popup button link'};
const GRP=[['Contact & social','Shown on Contact page, footer and WhatsApp buttons.',['brand','tagline','whatsapp','phone','email','address','facebook','instagram']],['Offer bar & button texts','',['offer','offerText','offerTextOff','btnOrder','btnInquiry','hidePlaceholders']],['Showroom & Google Map','',['showroom','showroomAddress','showroomHours','showroomMap','mapEmbed']],['Home page sections','Turn parts of the Home page on or off.',['secTrust','secCategories','secNew','secBanner','secCta']],['Colors','',['accent','bgColor']],['Popup','',['popup','popupTitle','popupText','popupButton','popupLink']]];
const SECS=[{id:'products',group:'Shop',title:'Products',intro:'Add products, change prices and discounts, photos, sold out, hide.'},{id:'cats',group:'Shop',title:'Categories',intro:'Add, rename, reorder or hide categories.'},{id:'payment',group:'Shop',title:'Payment',intro:'Payment ON/OFF, bKash QR + link, Bangla QR, delivery charges.'},{id:'pages',group:'Site',title:'Pages',intro:'Publish or hide pages, edit page texts, add new pages.'},{id:'settings',group:'Site',title:'Settings',intro:'Online Selling switch, contact, delivery, payment, map, colors.'},{id:'images',group:'Site',title:'Site photos',intro:'Hero, banner, About, founder, popup, QR and gallery photos.'},{id:'backup',group:'Help',title:'Backup',intro:'Download or restore a backup of products, pages and settings.'},{id:'manual',group:'Help',title:'Manual',intro:'Step by step guide to use this panel.'}];
const SL=[['Home hero photo','assets/images/hero/hero.jpg',1000],['Home banner photo','assets/images/banners/jeans-collection.jpg',1200],['About photo','assets/images/about/about.jpg',800],['Founder photo (optional)','assets/images/about/founder.jpg',600],['Popup photo','assets/images/popup/popup.jpg',800]];
for(let i=1;i<=12;i++)SL.push(['Gallery photo '+i,`assets/images/gallery/gallery-${String(i).padStart(2,'0')}.jpg`,900]);
const S={g:null,P:[],C:[],PG:[],ST:{},F:{},f:{},rc:{},del:[],dp:0,ds:0,dc:0,sec:'dash',open:{},q:'',sz:null};
const u8=s=>{let x='';new TextEncoder().encode(s).forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
const d8=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const rs=(f,w,png)=>new Promise((r,j)=>{const i=new Image();i.onerror=()=>j(new Error('That file is not a readable image (use JPG, PNG or WebP).'));i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);const d=c.toDataURL(png?'image/png':'image/jpeg',.82),kb=Math.round(d.length*.75/1024);if(kb>600)alert('This photo is large ('+kb+' KB). Smaller photos load faster and keep the repository small.');r(d)};i.src=URL.createObjectURL(f)});
async function gh(p,m,b){const r=await fetch(`https://api.github.com/repos/${S.g.owner}/${S.g.repo}${p?'/'+p:''}`,{method:m||'GET',headers:{Authorization:'Bearer '+S.g.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:b&&JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.message||('HTTP '+r.status));e.status=r.status;throw e}return j}
const fr=e=>e.status===401?'The access token is wrong or expired. Create a new token and log in again.':(/not accessible/i.test(e.message)||e.status===403)?'The token has no permission. Edit the token: Repository access = this repository, Contents = Read and write.':e.status===404?'Repository, branch or file not found. Check the username, repository name and branch, and that the token can access this repository.':/fast.?forward/i.test(e.message)?'The repository changed meanwhile. Press "Reload from GitHub" and try again.':e.message;
const ld=async p=>d8((await gh(`contents/${p}?ref=${S.g.branch}&t=${Date.now()}`)).content);
const repo=()=>gh('').then(j=>{S.sz=j.size;if(S.sec==='dash'||S.sec==='images')view()}).catch(()=>{});
const catLabel=k=>(S.C.find(c=>c.key===k)||{}).label||k;
const img=p=>(S.f[p]&&S.f[p].u)||S.rc[p]||(location.protocol.startsWith('http')?p:`https://raw.githubusercontent.com/${S.g.owner}/${S.g.repo}/${S.g.branch}/${p}`)+'?'+Math.floor(Date.now()/60000);
const pimg=p=>img(p.img||`assets/images/${p.cat}/${p.id}.jpg`);
const pd=p=>p.price>0?(p.old>p.price?`${p.old} → ${p.price} (−${Math.round((1-p.price/p.old)*100)}%)`:p.price):'no price';
const cnt=()=>(S.dp?1:0)+(S.ds?1:0)+(S.dc?1:0)+Object.keys(S.f).length+S.del.length+S.P.reduce((a,p)=>a+(p._pend?1:0)+(p._more||[]).length,0);
function bar(){const n=cnt(),st=$('#st'),b=$('#sv');if(!st)return;st.textContent=n?`${n} unsaved change${n>1?'s':''}`:'No unsaved changes';st.className='st'+(n?' dirty':'');b.disabled=!n}
const note=(k,t)=>{const m=$('#flash');if(m)m.innerHTML=t?`<div class="msg ${k}">${esc(t)}</div>`:''};
window.addEventListener('beforeunload',e=>{if(S.g&&cnt()){e.preventDefault();e.returnValue=''}});
/* ---------- login ---------- */
function rd(){try{return JSON.parse(localStorage.getItem(CK)||sessionStorage.getItem(CK))}catch(e){return null}}
function showLogin(msg){const p=rd()||{};$('#app').innerHTML=`<div class="login"><h1>NICE FASHION <span>Control</span></h1><p class="muted">Connect to your GitHub repository (one time on this device).</p>${msg?`<div class="msg err">${esc(msg)}</div>`:''}<form onsubmit="return conn(event)"><div class="fld"><span class="l">GitHub username (owner)</span><input type="text" id="lo" value="${esc(p.owner)}" autocapitalize="off" autocomplete="off"></div><div class="fld"><span class="l">Repository name</span><input type="text" id="lr" value="${esc(p.repo)}" autocapitalize="off" autocomplete="off"></div><div class="fld"><span class="l">Branch</span><input type="text" id="lb" value="${esc(p.branch||'main')}" autocapitalize="off"></div><div class="fld"><span class="l">Access token (fine-grained, this repository only)</span><input type="password" id="lt" value="${esc(p.token)}" autocomplete="off"></div><label class="chk" style="margin-bottom:12px"><input type="checkbox" id="lm" ${localStorage.getItem(CK)?'checked':''}> Remember on this device</label><button class="btn" id="lc" type="submit">Connect</button></form></div>`}
async function conn(e){if(e)e.preventDefault();S.g={owner:$('#lo').value.trim(),repo:$('#lr').value.trim(),branch:$('#lb').value.trim()||'main',token:$('#lt').value.trim()};const b=$('#lc');b.disabled=true;b.textContent='Connecting…';
try{await load();try{localStorage.removeItem(CK);sessionStorage.removeItem(CK);($('#lm').checked?localStorage:sessionStorage).setItem(CK,JSON.stringify(S.g))}catch(x){}S.sec='dash';go('dash');repo()}catch(x){S.g=null;showLogin(fr(x))}return false}
async function load(){const[a,b,c]=await Promise.all([ld('data/products.js'),ld('config.js'),ld('data/site.js').catch(e=>{if(e.status===404)throw new Error('data/site.js is missing in your repository. Upload it from the full zip first.');throw e})]);
const x=new Function(a+';return{CATEGORIES,PRODUCTS}')(),y=new Function(b+';return CONFIG')(),z=new Function(c+';return{PAGES,SITE}')();
S.C=x.CATEGORIES;S.P=x.PRODUCTS;S.F={...DEF,...y};S.PG=z.PAGES;S.ST=z.SITE;S.ST.custom=S.ST.custom||{};S.ST.about={...AB,...S.ST.about};S.f={};S.rc={};S.del=[];S.dp=S.ds=S.dc=0;S.orig=snap()}
function logout(){if(cnt()&&!confirm('You have unsaved changes. Log out anyway?'))return;try{localStorage.removeItem(CK);sessionStorage.removeItem(CK)}catch(e){}S.g=null;showLogin()}
async function reloadAll(){if(cnt()&&!confirm('Discard unsaved changes and reload from GitHub?'))return;try{await load();go(S.sec);note('ok','Reloaded from GitHub.')}catch(e){note('err',fr(e))}}
/* ---------- shell ---------- */
function shell(){const gs=[...new Set(SECS.map(s=>s.group))];
$('#app').innerHTML=`<div class="top"><div class="toprow"><div class="brand">NICE FASHION <span>Control</span></div><div class="toolbtns"><a class="tb" href="./index.html" target="_blank" rel="noopener">View site ↗</a><button class="tb" onclick="reloadAll()">Reload from GitHub</button><button class="tb" onclick="logout()">Log out</button></div></div><div class="nav"><button class="pill${S.sec==='dash'?' on':''}" onclick="go('dash')">Dashboard</button>${gs.map(g=>`<span class="sep">${g}</span>`+SECS.filter(s=>s.group===g).map(s=>`<button class="pill${S.sec===s.id?' on':''}" onclick="go('${s.id}')">${s.title}</button>`).join('')).join('')}</div></div><main class="wrap"><div id="flash"></div><div id="view"></div></main><div class="savebar"><span class="st" id="st"></span><button class="btn" id="sv" onclick="saveAll()">Save &amp; Publish</button></div>`;bar()}
function go(id){S.sec=id;shell();view()}
function view(){const v=$('#view');if(!v)return;const f={dash:vDash,products:vProducts,cats:vCats,pages:vPages,settings:vSettings,images:vImages,manual:vManual,payment:vPayment,backup:vBackup}[S.sec];v.innerHTML=f();if(S.sec==='products')plist();bar()}
function vDash(){const on=S.F.onlineSelling===true;return `<h1>Dashboard</h1><p class="muted">Pick what you want to change, edit it, then press "Save &amp; Publish". The live site updates in 1–2 minutes.</p><div class="box"><b>Online Selling &amp; Payment: ${on?'ON':'OFF'}</b><p class="muted" style="margin:6px 0 10px">${on?'Checkout is open: customers pay by bKash QR / bKash link / Bangla QR (and Cash on Delivery if enabled).':'OFF: no payment and no delivery. Customers only talk to you on WhatsApp.'}</p><button class="btn${on?'':' ghost'}" onclick="tgOn()">Turn ${on?'OFF':'ON'}</button></div><div class="box"><div class="stat"><span>${S.P.length} products (${S.P.filter(p=>p.new).length} visible)</span><span>${S.C.length} categories</span><span>${S.PG.length} pages</span><span>Online Selling: <b>${on?'ON':'OFF'}</b></span>${S.sz!=null?`<span>Repository: ${(S.sz/1024).toFixed(1)} MB</span>`:''}</div></div><div class="cards">${SECS.map(s=>`<button class="card" onclick="go('${s.id}')"><b>${s.title}</b><span>${s.intro}</span></button>`).join('')}</div><div class="box" style="margin-top:18px"><b>Tips</b><p class="muted" style="margin:6px 0 0">Photos are resized automatically before upload. Every save is one GitHub commit, so older versions can always be restored from the repository history. New to this panel? Open the Manual.</p></div>`}
/* ---------- helpers for forms ---------- */
const ib=(id,src,oc,lab)=>`<div class="imgbox"><img class="pv" id="${id}" src="${esc(src)}" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'"><div class="imgctl"><label class="btn small ghost" style="cursor:pointer">${lab||'Choose photo'}<input type="file" accept="image/*" hidden onchange="${oc}"></label></div></div>`;
const fld=(l,inner,full)=>`<div class="fld${full?' full':''}"><span class="l">${l}</span>${inner}</div>`;
const chk=(l,on,oc,dis)=>`<label class="chk"><input type="checkbox" ${on?'checked':''} ${dis?'disabled':''} onchange="${oc}"> ${l}</label>`;
const head=(i,thumb,title,sub,btns)=>`<div class="row-head"><span class="badge">${i+1}</span>${thumb?`<img class="thumb" src="${esc(thumb)}" alt="" onerror="this.style.visibility='hidden'">`:''}<div class="rtitle"><span id="rn${i}">${esc(title)}</span><div class="sub" id="rs${i}">${sub}</div></div><div class="rbtns">${btns}</div></div>`;
const btn3=(k,i,n,fl)=>`<button onclick="mv('${k}',${i},-1)" ${fl||i===0?'disabled':''}><b>▲</b>Up</button><button onclick="mv('${k}',${i},1)" ${fl||i===n-1?'disabled':''}><b>▼</b>Down</button>`;
function mv(k,i,d){const a={p:S.P,c:S.C,g:S.PG}[k],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];if(k==='g')S.ds=1;else S.dp=1;view()}
/* ---------- products ---------- */
function vProducts(){return `<h1>Products</h1><p class="muted">Tap Edit to change a product. Changes are saved only when you press "Save &amp; Publish".</p><div class="addrow" style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="q" placeholder="Search products…" value="${esc(S.q)}" oninput="S.q=this.value;plist()" style="flex:1;min-width:180px"><button class="btn" onclick="addP()">+ Add product</button></div><div id="pl"></div>`}
function psub(p){return `${esc(catLabel(p.cat))} · ${esc(pd(p))}${p.out?' · SOLD OUT':''}${p.new?'':' · hidden'}${p.feat?' · ★':''}`}
function plist(){const q=(S.q||'').toLowerCase();$('#pl').innerHTML=S.P.map((p,i)=>[p,i]).filter(a=>a[0].name.toLowerCase().includes(q)).map(([p,i])=>{const o=!!S.open[p.id];return `<div class="row-card">${head(i,p._pend?p._pend.u:pimg(p),p.name||'(new product)',psub(p),`<button onclick="ptg('${p.id}')">${o?'Close':'Edit'}</button>${btn3('p',i,S.P.length,q)}<button class="del" onclick="pdel(${i})"><b>✕</b>Delete</button>`)}${o?pbody(p,i):''}</div>`}).join('')||'<p class="muted">No products found.</p>'}
function pbody(p,i){return `<div class="rbody">${fld('Name',`<input type="text" value="${esc(p.name)}" oninput="pf(${i},'name',this.value)">`)}${fld('Category',`<select onchange="pc(${i},this.value)">${S.C.map(c=>`<option value="${c.key}" ${c.key===p.cat?'selected':''}>${esc(c.label)}</option>`).join('')}</select>`)}${fld('Price',`<input type="number" value="${p.price||''}" oninput="pf(${i},'price',this.value,1)">`)}${fld('Old price (optional — shows a discount)',`<input type="number" value="${p.old||''}" oninput="pf(${i},'old',this.value,1)"><small id="dh${i}">${dh(p)}</small>`)}${fld('Sizes (comma separated)',`<input type="text" value="${esc((p.sizes||[]).join(','))}" oninput="pa(${i},'sizes',this.value)">`)}${fld('Colors (comma separated, optional)',`<input type="text" value="${esc((p.colors||[]).join(','))}" oninput="pa(${i},'colors',this.value)">`)}${fld('Description',`<textarea rows="3" oninput="pf(${i},'desc',this.value)">${esc(p.desc)}</textarea>`,1)}<div class="fld full">${chk('Show on website',p.new,`pf(${i},'new',this.checked)`)}${chk('Featured (shown first on Home)',p.feat,`pf(${i},'feat',this.checked)`)}${chk('Sold out',p.out,`pf(${i},'out',this.checked)`)}</div>${fld('Main photo'+(p._new?' (required)':''),ib('pv'+i,p._pend?p._pend.u:pimg(p),`pp(${i},this)`),1)}${fld('More photos (optional)',`<div class="th2">${(p.more||[]).map((m,k)=>`<div><img src="${esc(img(m))}" alt=""><a onclick="prm(${i},${k})">×</a></div>`).join('')}${(p._more||[]).map((m,k)=>`<div><img src="${m.u}" alt=""><a onclick="prp(${i},${k})">×</a></div>`).join('')}</div><label class="btn small ghost" style="cursor:pointer">Add photos<input type="file" accept="image/*" multiple hidden onchange="pm(${i},this)"></label>`,1)}</div>`}
const dh=p=>p.old>p.price&&p.price>0?`Discount: −${Math.round((1-p.price/p.old)*100)}%`:(p.old&&p.old<=p.price?'Old price must be higher than the price':'');
function uh(i){const p=S.P[i];$('#rn'+i).textContent=p.name||'(new product)';$('#rs'+i).innerHTML=psub(p);const d=$('#dh'+i);if(d)d.textContent=dh(p)}
function pf(i,k,v,num){S.P[i][k]=num?(+v||0):v;S.dp=1;bar();uh(i)}
function pa(i,k,v){S.P[i][k]=v.split(',').map(x=>x.trim()).filter(Boolean);S.dp=1;bar()}
function ptg(id){S.open[id]=!S.open[id];plist()}
function nid(c){let m=0;S.P.filter(p=>p.cat===c).forEach(p=>m=Math.max(m,+p.id.split('-').pop()||0));return `${c}-${String(m+1).padStart(2,'0')}`}
function addP(){const c=S.C[0].key,id=nid(c);S.q='';S.P.push({id,name:'',cat:c,price:0,old:0,sizes:'M,L,XL,XXL'.split(','),colors:[],desc:'',new:true,out:false,feat:false,more:[],img:`assets/images/${c}/${id}.jpg`,_new:1});S.open[id]=1;S.dp=1;view();setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),50)}
function pc(i,c){const p=S.P[i];p.cat=c;if(p._new){delete S.open[p.id];p.id=nid(c);p.img=`assets/images/${c}/${p.id}.jpg`;p.sizes=(SZ[c]||'M,L,XL,XXL').split(',');S.open[p.id]=1}S.dp=1;view()}
async function pp(i,f){if(!f.files[0])return;try{const u=await rs(f.files[0],900);S.P[i]._pend={u,b:u.split(',')[1]};$('#pv'+i).src=u;$('#pv'+i).style.visibility='visible';S.dp=1;bar()}catch(e){note('err',e.message)}}
async function pm(i,f){const p=S.P[i];p._more=p._more||[];try{for(const x of f.files){const u=await rs(x,900);p._more.push({u,b:u.split(',')[1]})}S.dp=1;view()}catch(e){note('err',e.message)}}
function prm(i,k){const p=S.P[i];S.del.push(p.more[k]);p.more.splice(k,1);S.dp=1;view()}
function prp(i,k){S.P[i]._more.splice(k,1);S.dp=1;view()}
function pdel(i){const p=S.P[i];if(!confirm(`Delete "${p.name||'this product'}" and its photos? It is removed when you press Save & Publish.`))return;if(!p._new)S.del.push(p.img||`assets/images/${p.cat}/${p.id}.jpg`,...(p.more||[]));S.P.splice(i,1);S.dp=1;view()}
/* ---------- categories ---------- */
function vCats(){return `<h1>Categories</h1><p class="muted">Categories appear in Shop, filter chips and Home tiles.</p><div class="addrow"><button class="btn" onclick="addC()">+ Add category</button></div>`+S.C.map((c,i)=>{const o=S.open['c'+c.key];return `<div class="row-card">${head(i,img('assets/images/categories/'+c.key+'.jpg'),c.label,`${S.P.filter(p=>p.cat===c.key).length} products${c.show===false?' · hidden':''}`,`<button onclick="ctg('${c.key}')">${o?'Close':'Edit'}</button>${btn3('c',i,S.C.length)}<button class="del" onclick="cdel(${i})"><b>✕</b>Delete</button>`)}${o?`<div class="rbody">${fld('Name',`<input type="text" value="${esc(c.label)}" oninput="cu(${i},'label',this.value)">`)}${fld('Bangla name',`<input type="text" value="${esc(c.bn)}" oninput="cu(${i},'bn',this.value)">`)}<div class="fld full">${chk('Show on website',c.show!==false,`cu(${i},'show',this.checked)`)}</div>${fld('Cover photo (optional)',ib('cv'+i,img('assets/images/categories/'+c.key+'.jpg'),`cc(${i},this)`),1)}</div>`:''}</div>`}).join('')}
function ctg(k){S.open['c'+k]=!S.open['c'+k];view()}
function cu(i,k,x){S.C[i][k]=x;S.dp=1;bar();if(k==='label'&&$('#rn'+i))$('#rn'+i).textContent=x}
async function cc(i,f){if(!f.files[0])return;try{const u=await rs(f.files[0],700),p=`assets/images/categories/${S.C[i].key}.jpg`;S.f[p]={b:u.split(',')[1],u};$('#cv'+i).src=u;$('#cv'+i).style.visibility='visible';bar()}catch(e){note('err',e.message)}}
function addC(){const n=(prompt('Category name (English), e.g. Sweaters')||'').trim();if(!n)return;let k=sl(n)||'cat'+(S.C.length+1);while(S.C.some(c=>c.key===k))k+='-2';S.C.push({key:k,label:clean(n),bn:'',show:true});S.open['c'+k]=1;S.dp=1;view()}
function cdel(i){const c=S.C[i];if(S.P.some(p=>p.cat===c.key)){alert('This category still has products. Move or delete them first, or just untick "Show on website".');return}if(confirm('Delete this category?')){S.del.push(`assets/images/categories/${c.key}.jpg`);S.C.splice(i,1);S.dp=1;view()}}
/* ---------- pages ---------- */
function vPages(){return `<h1>Pages</h1><p class="muted">Untick Published to hide a page (its menu link disappears and the link shows "Page not available"). Home cannot be hidden.</p><div class="addrow"><button class="btn" onclick="addG()">+ Add new page</button></div>`+S.PG.map((p,i)=>{const o=S.open['g'+p.k];let b='';if(o){b=`<div class="rbody">${fld('Menu name',`<input type="text" value="${esc(p.t)}" oninput="gu(${i},'t',this.value)">`)}${fld('Bangla name',`<input type="text" value="${esc(p.bn)}" oninput="gu(${i},'bn',this.value)">`)}<div class="fld full">${chk('Published',p.show!==false,`gu(${i},'show',this.checked)`,p.k==='index')}</div></div><div class="rhead2">Page texts</div><div class="rbody">`;
if(p.custom){const c=S.ST.custom[p.slug];b+=fld('Page title',`<input type="text" value="${esc(c.title)}" oninput="sc('custom.${p.slug}.title',this.value)">`,1)+fld('Text (blank line = new paragraph)',`<textarea rows="8" oninput="sc('custom.${p.slug}.body',this.value)">${esc(c.body)}</textarea>`,1)+fld('Photo (optional)',ib('gp'+i,c.img?img('assets/images/pages/'+p.slug+'.jpg'):'',`gpp(${i},this)`),1)}
else{const g=GR[p.k];b+=Object.keys(S.ST[g]).map(k=>{const x=S.ST[g][k];return fld(k.replace(/_/g,' '),String(x).length>70?`<textarea rows="3" oninput="sc('${g}.${k}',this.value)">${esc(x)}</textarea>`:`<input type="text" value="${esc(x)}" oninput="sc('${g}.${k}',this.value)">`,String(x).length>70)}).join('')+`<div class="fld full"><small>Photos for this page are in "Site photos".</small></div>`}
b+='</div>'}
return `<div class="row-card">${head(i,'',p.t,p.show===false?'Hidden':(p.custom?'Custom page':'Published'),`<button onclick="gtg('${p.k}')">${o?'Close':'Edit'}</button>${btn3('g',i,S.PG.length)}${p.custom?`<button class="del" onclick="gdel(${i})"><b>✕</b>Delete</button>`:''}`)}${b}</div>`}).join('')}
function gtg(k){S.open['g'+k]=!S.open['g'+k];view()}
function gu(i,k,x){S.PG[i][k]=x;S.ds=1;bar();if(k==='t'&&$('#rn'+i))$('#rn'+i).textContent=x;if(k==='show')$('#rs'+i).textContent=x?(S.PG[i].custom?'Custom page':'Published'):'Hidden'}
function sc(p,x){const k=p.split('.');let o=S.ST;k.slice(0,-1).forEach(a=>o=o[a]);o[k[k.length-1]]=x;S.ds=1;bar()}
function addG(){const t=clean((prompt('New page name, e.g. Size Guide')||'').trim());if(!t)return;let s=sl(t)||'page'+(Date.now()%1000);while(S.ST.custom[s])s+='-2';S.PG.push({k:'x-'+s,t,bn:'',show:true,custom:true,slug:s});S.ST.custom[s]={title:t,body:'',img:false};S.open['gx-'+s]=1;S.ds=1;view()}
function gdel(i){const p=S.PG[i];if(!confirm('Delete this page?'))return;if(S.ST.custom[p.slug].img)S.del.push(`assets/images/pages/${p.slug}.jpg`);delete S.ST.custom[p.slug];S.PG.splice(i,1);S.ds=1;view()}
async function gpp(i,f){if(!f.files[0])return;try{const p=S.PG[i],u=await rs(f.files[0],900);S.f[`assets/images/pages/${p.slug}.jpg`]={b:u.split(',')[1],u};S.ST.custom[p.slug].img=true;S.ds=1;$('#gp'+i).src=u;$('#gp'+i).style.visibility='visible';bar()}catch(e){note('err',e.message)}}
/* ---------- settings ---------- */
function sfld(k){const x=S.F[k],l=LB[k]||k.replace(/([A-Z])/g,' $1').toLowerCase();if(typeof x==='boolean')return `<div class="fld full">${chk(l,x,`sf('${k}',this.checked)`)}</div>`;
if(/accent|color/i.test(k)&&/^#[0-9a-f]{6}$/i.test(x))return fld(l,`<input type="color" value="${x}" oninput="sf('${k}',this.value)">`);const n=typeof x==='number',long=String(x).length>60||k==='mapEmbed'||k==='payNote';
return fld(l,long?`<textarea rows="3" oninput="sf('${k}',this.value)">${esc(x)}</textarea>`:`<input ${n?'type="number"':'type="text"'} value="${esc(x)}" oninput="sf('${k}',this.value,${n})">`,long)}
function sf(k,x,num){S.F[k]=k==='mapEmbed'?((String(x).match(/src=["']([^"']+)/)||[0,x])[1]).trim():num?(+x||0):x;S.dc=1;bar()}
function tgOn(){S.F.onlineSelling=!S.F.onlineSelling;S.dc=1;view()}
function vSettings(){const on=S.F.onlineSelling===true,used=new Set(['v'].concat(PAYK,...GRP.map(g=>g[2]))),oth=Object.keys(S.F).filter(k=>!used.has(k));
return `<h1>Settings</h1><p class="muted">Tap Save &amp; Publish when done.</p><div class="box"><b>Online Selling &amp; Payment</b><p class="muted" style="margin:6px 0 12px">${on?'ON: checkout with delivery and payment (bKash QR + link, Bangla QR, Cash on Delivery if enabled). Set these in the Payment section.':'OFF: no payment, no Cash on Delivery, no delivery. Customers only check availability on WhatsApp and visit the showroom.'}</p><button class="btn${on?'':' ghost'}" onclick="tgOn()">Online Selling: ${on?'ON':'OFF'} — tap to turn ${on?'OFF':'ON'}</button></div>`+GRP.concat(oth.length?[['Other','',oth]]:[]).map(g=>`<div class="row-card"><div class="rhead2">${g[0]}${g[1]?`<div class="muted" style="font-weight:400;margin:2px 0 0;font-size:12px">${g[1]}</div>`:''}</div><div class="rbody">${g[2].filter(k=>k in S.F).map(sfld).join('')}</div></div>`).join('')}
/* ---------- site photos ---------- */
function vImages(){return `<h1>Site photos</h1><p class="muted">Choose a new photo to replace the current one (the file name stays the same).</p>${S.sz!=null?`<div class="msg ${S.sz>800000?'err':'info'}">Repository size: ${(S.sz/1024).toFixed(1)} MB (GitHub recommends staying under about 1000 MB)${S.sz>800000?' — getting full!':''}</div>`:''}`+SL.map((s,i)=>`<div class="row-card"><div class="rhead2">${s[0]}</div><div class="rbody">${fld('',ib('si'+i,img(s[1]),`si(${i},this)`),1)}</div></div>`).join('')}
async function si(i,f){if(!f.files[0])return;try{const s=SL[i],u=await rs(f.files[0],s[2],s[3]);S.f[s[1]]={b:u.split(',')[1],u};$('#si'+i).src=u;$('#si'+i).style.visibility='visible';bar()}catch(e){note('err',e.message)}}
/* ---------- payment ---------- */
const sx=k=>k in S.F?sfld(k):'',PQ={b:'assets/images/payment/bkash-qr.png',n:'assets/images/payment/bangla-qr.png'};
function vPayment(){const on=S.F.onlineSelling===true,qb=(k,l)=>fld(l,ib('q'+k,img(PQ[k]),`pq('${k}',this)`),1);
return `<h1>Payment</h1><p class="muted">OFF = customers only talk to you on WhatsApp. ON = Checkout with the methods below. Upload your real QR photos before turning ON.</p><div class="box"><b>Online Selling &amp; Payment: ${on?'ON':'OFF'}</b><p class="muted" style="margin:6px 0 10px">${on?'Checkout is open for customers.':'Checkout is closed. Customers only check availability on WhatsApp.'}</p><button class="btn${on?'':' ghost'}" onclick="tgOn()">Turn ${on?'OFF':'ON'}</button></div>
<div class="row-card"><div class="rhead2">bKash</div><div class="rbody">${sx('bkash')}${sx('bkashUrl')}${sx('showBkashQr')}${qb('b','bKash QR code photo')}</div></div>
<div class="row-card"><div class="rhead2">Bangla QR</div><div class="rbody">${sx('payment')}${sx('accountName')}${qb('n','Bangla QR code photo')}</div></div>
<div class="row-card"><div class="rhead2">Other methods</div><div class="rbody">${sx('cod')}${sx('nagad')}</div></div>
<div class="row-card"><div class="rhead2">Checkout options</div><div class="rbody">${sx('trxAsk')}${sx('payNote')}${sx('currency')}${sx('deliveryDhaka')}${sx('deliveryOutside')}</div></div>`}
async function pq(k,f){if(!f.files[0])return;try{const u=await rs(f.files[0],700,true);S.f[PQ[k]]={b:u.split(',')[1],u};$('#q'+k).src=u;$('#q'+k).style.visibility='visible';bar()}catch(e){note('err',e.message)}}
/* ---------- backup ---------- */
const snap=()=>JSON.stringify({format:'nf-backup-1',date:new Date().toISOString(),config:S.F,categories:S.C.map(strip),products:S.P.map(strip),pages:S.PG,site:S.ST});
function dlText(txt,name){const a=document.createElement('a'),d=new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=`${name}-${d}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const autoBak=()=>{try{return localStorage.getItem('nf_autobak')!=='0'}catch(e){return true}};
function vBackup(){return `<h1>Backup</h1><p class="muted">The backup file holds products, categories, pages, texts and settings. Photos stay safe in your GitHub repository, and every Save is a commit you can restore from GitHub History.</p><div class="box"><b>Download a backup</b><p class="muted" style="margin:6px 0 10px">Downloads the last saved version (as loaded from GitHub).</p><button class="btn" onclick="dlText(S.orig||snap(),'nf-backup')">Download backup now</button></div><div class="box"><label class="chk"><input type="checkbox" ${autoBak()?'checked':''} onchange="try{localStorage.setItem('nf_autobak',this.checked?'1':'0')}catch(e){}"> Download a backup file automatically before every Save &amp; Publish</label></div><div class="box"><b>Restore from a backup file</b><p class="muted" style="margin:6px 0 10px">Loads the file into the panel. Nothing goes live until you press Save &amp; Publish.</p><label class="btn ghost" style="cursor:pointer">Choose backup file<input type="file" accept=".json,application/json" hidden onchange="restoreBk(this)"></label></div>`}
function restoreBk(f){const x=f.files[0];if(!x)return;const r=new FileReader();r.onload=()=>{try{const b=JSON.parse(r.result);if(b.format!=='nf-backup-1'||!Array.isArray(b.products)||!Array.isArray(b.categories)||!Array.isArray(b.pages))throw new Error('This is not a NICE FASHION backup file.');if(!confirm('Load this backup? Your unsaved changes will be replaced.'))return;S.F={...DEF,...b.config};S.C=b.categories;S.P=b.products;S.PG=b.pages;S.ST=b.site;S.ST.custom=S.ST.custom||{};S.f={};S.del=[];S.dp=S.ds=S.dc=1;view();note('ok','Backup loaded. Review it, then press Save & Publish to make it live.')}catch(e){note('err',e.message)}};r.readAsText(x)}

['Online Selling ON/OFF','Settings-এর ওপরের বাটন। OFF হলে পেমেন্ট, Cash on Delivery ও ডেলিভারি সাইট থেকে সরে যায়, ক্রেতা শুধু WhatsApp-এ availability জানতে পারে। ON করলে Cart-এ ডেলিভারি ও পেমেন্ট আসে।'],
['ঠিকানা, ফোন, Google Map','Settings → Contact & social, Showroom & Google Map। Map-এর জন্য Google Maps-এ দোকান খুঁজে Share → Embed a map → কোড কপি করে পেস্ট করুন। About পেজের ফাউন্ডার, অফিস ও সময়ের তথ্য Pages → About → Edit-এ।'],
['Payment (bKash QR, link, Bangla QR)','Payment সেকশনের ওপরের বাটনে Online Selling & Payment ON/OFF করুন। OFF হলে ক্রেতা শুধু WhatsApp-এ কথা বলবে। ON হলে Checkout পেজে bKash QR ছবি, bKash payment লিংক ও Bangla QR দেখাবে। QR ছবি "Choose photo" দিয়ে আপলোড করুন, bKash নম্বর ও লিংক বসান। ON করার আগে আসল QR ছবি দিন।'],['Backup','Backup সেকশন থেকে সর্বশেষ সেভ-করা অবস্থার ব্যাকআপ ফাইল নামানো যায়। প্রতিবার Save করার আগে নিজে থেকেও নামে (বন্ধ করা যায়)। পরে "Restore" দিয়ে ফাইলটি দিলে সব ফিরে আসে, তারপর Save & Publish চাপুন। ছবি GitHub-এই থাকে।'],['Save & Publish কীভাবে কাজ করে','নিচের বাটন সব বদল এক GitHub commit-এ পাঠায়। সাইটে আসতে ১–২ মিনিট লাগে। বদল বাকি থাকলে বাটনের পাশে "N unsaved changes" লেখা থাকে। ভুল হলে GitHub-এর History থেকে আগের অবস্থায় ফেরা যায়।'],
['সমস্যা হলে','"not accessible by personal access token": Token Edit করে Contents = Read and write করুন। ছবি দেখা না গেলে সাইট GitHub Pages লিংক থেকে খুলুন। বদল সাইটে না এলে ২–৩ মিনিট অপেক্ষা করে রিফ্রেশ করুন। "repository changed meanwhile" এলে Reload from GitHub চাপুন।']];
function vManual(){return `<h1>Manual</h1><p class="muted">ধাপে ধাপে নির্দেশিকা। বিস্তারিত PDF/Word ম্যানুয়ালও আছে।</p>`+MAN.map((m,i)=>`<details class="box" ${i===0?'open':''}><summary>${i+1}. ${m[0]}</summary><p>${m[1]}</p></details>`).join('')}
/* ---------- save ---------- */
const strip=o=>{const r={};for(const k in o)if(k[0]!=='_')r[k]=o[k];return r};
const cl=v=>typeof v==='string'?clean(v):Array.isArray(v)?v.map(cl):v;
async function saveAll(){const bad=S.P.find(p=>p._new&&(!p.name.trim()||!p._pend));if(bad){S.sec='products';go('products');note('err',`The new product "${bad.name||'(no name)'}" needs a name and a main photo.`);return}
if(autoBak()&&S.orig)dlText(S.orig,'nf-backup-before-save');const sv=$('#sv');sv.disabled=true;sv.textContent='Saving…';note('info','Preparing…');
try{const F2={...S.f},PP=S.P.map(p=>{const o=strip(p);o.more=[...(p.more||[])];if(!o.img)o.img=`assets/images/${p.cat}/${p.id}.jpg`;if(p._pend)F2[o.img]=p._pend;(p._more||[]).forEach((m,k)=>{const q=`${o.img.replace(/\/[^/]*$/,'')}/${p.id}-b${o.more.length+1}-${Date.now()%10000}${k}.jpg`;F2[q]=m;o.more.push(q)});return o});
const CC=S.C.map(c=>strip(c)),L=Object.keys(F2).map(p=>[p,F2[p].b]);
if(S.dp)L.push(['data/products.js',u8(`/* Managed by the control panel. "new":true = show on site ; "out":true = sold out ; "feat":true = featured */\nconst CATEGORIES=${JSON.stringify(CC.map(c=>({...c,label:cl(c.label),bn:cl(c.bn||'')})),null,1)};\nconst PRODUCTS=[\n${PP.map(p=>JSON.stringify(Object.fromEntries(Object.entries(p).map(([k,v])=>[k,k==='img'||k==='more'?v:cl(v)])))).join(',\n')}\n];\n`)]);
if(S.ds)L.push(['data/site.js',u8(`/* Managed by the control panel (pages, menu and page texts). */\nconst PAGES=${JSON.stringify(S.PG,null,1)};\nconst SITE=${JSON.stringify(S.ST,null,1)};\n`)]);
S.F.v=Date.now();L.push(['config.js',u8(`/* Managed by the control panel (you can also edit by hand) */\nconst CONFIG=${JSON.stringify(S.F,null,1)};\n`)]);
const D=[...new Set(S.del)].filter(p=>!F2[p]);
const rf=await gh(`git/ref/heads/${S.g.branch}`),cs=rf.object.sha,ts=(await gh(`git/commits/${cs}`)).tree.sha,ex=new Set((await gh(`git/trees/${ts}?recursive=1`)).tree.map(t=>t.path)),T=[];let n=0;
for(const[p,c]of L){note('info',`Uploading ${++n} of ${L.length}…`);const b=await gh('git/blobs','POST',{content:c,encoding:'base64'});T.push({path:p,mode:'100644',type:'blob',sha:b.sha})}
D.forEach(p=>{if(ex.has(p))T.push({path:p,mode:'100644',type:'blob',sha:null})});
note('info','Saving as one update…');const nt=await gh('git/trees','POST',{base_tree:ts,tree:T}),nc=await gh('git/commits','POST',{message:'Update from control panel',tree:nt.sha,parents:[cs]});await gh(`git/refs/heads/${S.g.branch}`,'PATCH',{sha:nc.sha});
Object.keys(F2).forEach(p=>S.rc[p]=F2[p].u);S.P=PP;S.orig=snap();S.f={};S.del=[];S.dp=S.ds=S.dc=0;view();note('ok','Saved. The website updates in 1–2 minutes.');repo()}
catch(e){note('err',fr(e));bar()}finally{sv.textContent='Save & Publish';bar()}}
/* ---------- start ---------- */
document.addEventListener('DOMContentLoaded',()=>{const p=rd();if(p&&p.token){showLogin();conn()}else showLogin()});
